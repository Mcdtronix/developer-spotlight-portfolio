# -----------------------------------------------------------------------------
# mcdtronix.co.zw — Portfolio (React SPA + Django API)
# Source of truth: deploy/nginx/mcdtronix.co.zw.conf in the portfolio repo.
# Installed to /etc/nginx/sites-available/ by deploy/server/bootstrap-portfolio.sh
# -----------------------------------------------------------------------------

upstream portfolio_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

# HTTP: ACME challenges for renewals, everything else -> HTTPS apex.
server {
    listen 80;
    listen [::]:80;
    server_name mcdtronix.co.zw www.mcdtronix.co.zw;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://mcdtronix.co.zw$request_uri;
    }
}

# HTTPS www -> apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mcdtronix.co.zw;

    ssl_certificate     /etc/letsencrypt/live/mcdtronix.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcdtronix.co.zw/privkey.pem;
    include snippets/ssl-params.conf;

    return 301 https://mcdtronix.co.zw$request_uri;
}

# HTTPS apex — the application.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcdtronix.co.zw;

    ssl_certificate     /etc/letsencrypt/live/mcdtronix.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcdtronix.co.zw/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log warn;

    # `current` is a symlink swapped atomically on each deploy.
    root  /srv/apps/portfolio/current/frontend;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    # SPA entry point — never cached, so a new deploy is visible immediately.
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite output is content-hashed: cache forever.
    location /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Django API + admin.
    location /api/ {
        include snippets/portfolio-proxy.conf;
    }

    location /admin/ {
        include snippets/portfolio-proxy.conf;
    }

    # Django static (admin CSS/JS) — collected per release.
    location /static/ {
        alias /srv/apps/portfolio/current/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    # User uploads — shared across releases.
    location /media/ {
        alias /srv/apps/portfolio/shared/media/;
        expires 7d;
        access_log off;
    }

    # Client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

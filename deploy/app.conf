# -----------------------------------------------------------------------------
# Per-application deployment settings.
#
# The scripts in deploy/scripts/ are generic. To reuse them for another app
# (e.g. the Prison Management System on pms.mcdtronix.co.zw) copy the folder
# into that repo and change only this file.
# -----------------------------------------------------------------------------

APP_NAME="portfolio"
SERVICE="portfolio"                      # systemd unit name
DOMAIN="mcdtronix.co.zw"

APP_ROOT="/srv/apps/portfolio"           # releases/, shared/, venvs/, current ->
BACKUP_ROOT="/var/backups/apps/portfolio"

APP_PORT=8001                            # Gunicorn (live). PMS will use 8002.
PREFLIGHT_PORT=8091                      # Throwaway Gunicorn used to test a release before go-live

KEEP_RELEASES=5                          # Releases kept on disk for instant rollback
BACKUP_RETENTION_DAYS=14

HEALTH_PATH="/api/health/"
# Endpoints that must answer 200 before and after go-live.
SMOKE_PATHS="/api/hero/ /api/about/ /api/navigation/ /api/projects/ /api/skills/ /api/experience/ /api/contact/"

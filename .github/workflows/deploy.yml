# -----------------------------------------------------------------------------
# Portfolio CI/CD -> https://mcdtronix.co.zw (Contabo VPS)
#
#   pull_request : test + build only
#   push to main : test + build -> package -> deploy -> verify (auto-rollback)
#
# The server side (backup, pre-flight test, atomic switch, rollback) lives in
# deploy/scripts/deploy.sh. Runbook: deploy/README.md
#
# Required repository secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS   (optional: VPS_PORT)
# -----------------------------------------------------------------------------
name: CI/CD · Portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.12"     # same as Ubuntu 24.04 on the VPS
  NODE_VERSION: "22"
  APP_ROOT: /srv/apps/portfolio
  SITE_URL: https://mcdtronix.co.zw

jobs:
  # ------------------------------------------------------------------ CI ----
  backend:
    name: Backend · tests & checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio_ci
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgresql
      DB_NAME: portfolio_ci
      DB_USER: portfolio
      DB_PASSWORD: portfolio
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEBUG: "False"
      SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Django deploy checks
        run: python manage.py check --deploy --fail-level ERROR

      - name: Migrations apply cleanly on PostgreSQL
        run: python manage.py migrate --noinput

      - name: Tests
        run: python manage.py test --noinput -v 2

  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build          # uses .env.production

      - name: Sanity-check bundle
        run: |
          test -f dist/index.html
          grep -q 'id="root"' dist/index.html
          ls dist/assets/*.js >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  scripts:
    name: Deploy scripts · shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: shellcheck
        run: shellcheck -x -S warning deploy/scripts/*.sh deploy/server/*.sh

  # ------------------------------------------------------------- package ----
  package:
    name: Package release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, scripts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend

      - name: Assemble release archive
        run: |
          mkdir -p release/backend
          git archive HEAD:Backend | tar -x -C release/backend
          # Never ship local artefacts or secrets.
          rm -rf release/backend/env release/backend/venv release/backend/staticfiles \
                 release/backend/db.sqlite3 release/backend/.env
          find release/backend -name '__pycache__' -type d -prune -exec rm -rf {} +
          echo "${GITHUB_SHA}" > release/REVISION
          tar -czf release.tar.gz -C release .
          echo "### Release ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "Archive size: $(du -h release.tar.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 14

  # -------------------------------------------------------------- deploy ----
  deploy:
    name: Deploy to production
    needs: package
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    concurrency:
      group: production-portfolio
      cancel-in-progress: false      # never interrupt a running deploy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: deploy

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY"     > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${VPS_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ConnectTimeout 15
          EOF
          ssh vps 'echo "Connected to $(hostname) as $(whoami)"'

      - name: Upload deploy scripts and release
        run: |
          scp -q deploy/scripts/*.sh deploy/app.conf vps:"${APP_ROOT}/bin/"
          ssh vps "chmod 750 ${APP_ROOT}/bin/*.sh"
          scp -q release.tar.gz vps:"${APP_ROOT}/incoming/release-${GITHUB_SHA}.tar.gz"

      - name: Deploy (backup → migrate → pre-flight → switch → verify)
        run: ssh vps "${APP_ROOT}/bin/deploy.sh ${APP_ROOT}/incoming/release-${GITHUB_SHA}.tar.gz"

      - name: Verify from the public internet
        id: verify
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "${SITE_URL}/api/health/" | grep -q '"status": "ok"' \
               && curl -fsS --max-time 10 "${SITE_URL}/" | grep -q 'id="root"'; then
              echo "✅ ${SITE_URL} is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."; sleep 6
          done
          echo "::error::${SITE_URL} failed external verification"
          exit 1

      - name: Roll back (external verification failed)
        if: failure() && steps.verify.outcome == 'failure'
        run: ssh vps "${APP_ROOT}/bin/rollback.sh"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment ${GITHUB_SHA::7} — ${{ job.status }}"
            echo "- Site: ${SITE_URL}"
            echo "- Triggered by: ${GITHUB_ACTOR} (${GITHUB_EVENT_NAME})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
